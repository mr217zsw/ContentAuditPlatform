; PHP-FPM 生产环境进程池配置
[www]

user = www-data
group = www-data

; 监听方式 (TCP)
listen = 127.0.0.1:9000

; 进程管理模式
; dynamic = 按需创建 (推荐)
; static  = 固定数量
; ondemand = 按需创建,空闲销毁
pm = dynamic

; 最大子进程数
; 公式: (总内存 - 预留) / 每个进程约 50-80MB
; 假设 1GB 内存: (1024 - 256) / 60 ≈ 12
pm.max_children = 20

; 初始启动进程数
pm.start_servers = 4

; 最小空闲进程数
pm.min_spare_servers = 2

; 最大空闲进程数
pm.max_spare_servers = 8

; 每个进程最大处理请求数 (防内存泄漏)
pm.max_requests = 500

; 慢日志
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 5s

; 超时设置
request_terminate_timeout = 60s

; 状态页 (Prometheus 可抓取)
pm.status_path = /fpm-status
ping.path = /fpm-ping

; 日志
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
