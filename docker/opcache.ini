; PHP Opcache 生产环境优化配置
; 参考: https://www.php.net/manual/zh/opcache.configuration.php
; 注意: zend_extension=opcache.so 不在此声明，因为 docker-php-ext-install opcache 已将 opcache 编译为 builtin 扩展
;       在 CLI 下重复声明 zend_extension 会导致 "Cannot load Zend OPcache - it was already loaded" 错误

; 启用 Opcache
opcache.enable=1
opcache.enable_cli=0

; 内存分配 (建议 128MB-256MB)
opcache.memory_consumption=256

; 最大缓存文件数 (建议 4000-10000)
opcache.max_accelerated_files=10000

; 验证文件时间戳 (生产环境建议关闭)
opcache.validate_timestamps=0

; 重新验证频率 (秒, 仅 validate_timestamps=1 时有效)
opcache.revalidate_freq=0

; 字符串驻留
opcache.interned_strings_buffer=64

; 快速关闭
opcache.fast_shutdown=1

; 文件更新保护
opcache.file_update_protection=2

; 最大浪费百分比
opcache.max_wasted_percentage=10

; JIT 编译 (PHP 8.0+)
opcache.jit=tracing
opcache.jit_buffer_size=100M
