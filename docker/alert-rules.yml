# ============================================================
# Prometheus 告警规则
# ============================================================

groups:
  - name: audit-platform-alerts
    interval: 30s
    rules:

      # ---- 服务存活 ----
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 服务已宕机"
          description: "服务 {{ $labels.job }} (实例 {{ $labels.instance }}) 已超过 2 分钟无响应"

      # ---- 高 CPU 使用率 ----
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率过高 (>85%)"
          description: "实例 {{ $labels.instance }} 的 CPU 使用率已超过 85%, 持续 5 分钟"

      # ---- 高内存使用率 ----
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高 (>90%)"
          description: "实例 {{ $labels.instance }} 的内存使用率已超过 90%, 持续 5 分钟"

      # ---- 磁盘空间不足 ----
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "磁盘空间不足 (<15%)"
          description: "实例 {{ $labels.instance }} 磁盘剩余空间低于 15%"

      # ---- MySQL 连接数过高 ----
      - alert: HighMySQLConnections
        expr: mysql_global_status_threads_connected > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 连接数过高"
          description: "MySQL 当前连接数 {{ $value }}, 超过阈值 80"

      # ---- HTTP 5xx 错误率高 ----
      - alert: HighHTTP5xxRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 错误率过高 (>5%)"
          description: "5xx 错误率当前为 {{ $value | humanize }}%"
