# ============================================================
# Prometheus 监控配置
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# 告警规则
rule_files:
  - "/etc/prometheus/alert-rules.yml"

# 抓取目标
scrape_configs:

  # ---- Prometheus 自身 ----
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---- Node Exporter (宿主机指标) ----
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ---- MySQL Exporter ----
  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  # ---- Redis Exporter ----
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ---- Laravel 应用指标 (通过 /api/metrics) ----
  - job_name: "laravel"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["app:80"]
